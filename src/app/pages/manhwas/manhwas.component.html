<app-menu-title></app-menu-title>
<main class="container__articles">
  <div class="articles__grid">
    @for (manhwa of manhwaArticles; track manhwa.id) {
      <app-card
        [Id]="manhwa.id"
        [cardTitle]="manhwa.title"
        [photoCover]="manhwa.photoCover"
      ></app-card>
    } @empty {
      <p class="empty-message">Nenhum manhwa encontrado.</p>
    }
  </div>
</main>
