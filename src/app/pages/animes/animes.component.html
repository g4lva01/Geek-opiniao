<app-menu-title></app-menu-title>
<main class="container__articles">
  <div class="articles__grid">
    @for (anime of animeArticles; track anime.id) {
      <app-card
        [Id]="anime.id"
        [cardTitle]="anime.title"
        [photoCover]="anime.photoCover"
      ></app-card>
    } @empty {
      <p class="empty-message">Nenhum anime encontrado.</p>
    }
  </div>
</main>
